<!doctype html>

<title>Píxel</title>

<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f0;--ink:#16161a;--blue:#4a5cff;--pink:#ff4d6d;--gold:#ffc83d;--mint:#2bd4a4;--px:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",sans-serif;position:relative;
 background-image:linear-gradient(rgba(22,22,26,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(22,22,26,.05) 1px,transparent 1px);background-size:var(--px) var(--px)}
.top{position:absolute;left:80px;right:80px;top:40px;display:flex;justify-content:space-between;font:400 13px "JetBrains Mono";color:#6c6c68}
.left{position:absolute;left:80px;top:150px;width:600px}
.left small{font:700 16px "Silkscreen";color:var(--blue)}
.left h1{font:700 128px/0.95 "Silkscreen";letter-spacing:-.02em;margin:16px 0 26px;text-shadow:8px 8px 0 var(--gold)}
.left p{font:400 22px/1.45 "Inter Tight";color:#3c3c38;max-width:440px}
.lives{position:absolute;left:80px;bottom:72px;display:flex;gap:28px;font:400 13px "JetBrains Mono";color:#6c6c68;align-items:center}
.lives svg{vertical-align:middle;margin-right:8px}
.col{position:absolute;right:80px;top:140px;width:560px;display:grid;gap:22px}
.btn{height:120px;position:relative;display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:22px;padding:0 30px 0 26px;background:#fff;
 clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px));
 box-shadow:inset 0 0 0 4px var(--ink),inset 0 -12px 0 rgba(22,22,26,.08)}
.btn b{font:700 34px "Inter Tight";letter-spacing:-.02em}
.btn small{display:block;font:400 13px "JetBrains Mono";color:#6c6c68;margin-top:4px}
.btn .k{font:700 18px "Silkscreen"}
.btn.on{background:var(--gold);box-shadow:inset 0 0 0 4px var(--ink),inset 0 -12px 0 rgba(0,0,0,.12)}
svg.ic{image-rendering:pixelated;shape-rendering:crispEdges}
.shadow{position:absolute;inset:0}
</style></head><body>
